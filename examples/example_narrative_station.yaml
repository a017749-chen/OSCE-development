# 範例教案（非醫學職類／敘事醫學評量規準；虛構病人無個資）。建置：
#   python scripts/build_station.py examples/example_narrative_station.yaml -o out/範例_護理造口照護_敘事醫學.docx
# 格式規格一律來自 rules.yaml；這裡只放臨床與敘事內容。

station_type: communication      # history / physical / communication / explanation
number: ""                       # 站次號；空白＝考試當天再填
rubric: narrative                # checklist 或 narrative
sign: 58歲女性，直腸癌術後造口護理衛教

candidate:
  background: 你是病房護理師，病人即將出院，進行造口居家照護指導
  tasks:
    - 評估病人造口自我照護技巧與目前心理適應困擾
    - 提供漸進式造口護理衛教並解答居家生活疑慮
    - 運用同理心支持病人面對身體心象改變之調適
  notes:
    - 請注意病人之非語言情緒反應並給予支持
  report:
    vitals: BP 120/78、HR 76、BT 36.8℃、RR 16、SpO2 99%
    symptoms: 術後傷口癒合良好，造口黏膜粉紅濕潤，已可進軟質飲食
    other: 腹部降結腸單腔造口（Colostomy），排泄物呈軟糊狀
    other_2: 造口便袋目前由護理人員更換，病人眼神經常刻意迴避造口

narrative:
  全心傾聽與病患故事探索:
    4: 主動辨識病人迴避造口之非語言暗號，營造安全溫暖氛圍，深入探詢造口對其日常出門、家庭生活及自我認同之衝擊。
    3: 能詢問病人對造口的感受與生活困擾，態度親切友善，能給予病患足夠時間表達。
    2: 僅針對生理照護問題提問，對病人透露的情緒暗號（如嘆氣、沉默）未主動追問或僅簡略帶過。
    1: 完全忽略病人之情緒暗號與生活脈絡，僅機械化單向宣導造口更換技術。
  同理共鳴與處境再現:
    4: 精準反映病人「害怕便袋外漏被嫌棄」的深層焦慮，以「面對重大身體改變感到恐懼非常自然」賦予情緒合理化，真誠承接脆弱。
    3: 能口頭表達理解與安慰（如「您不要想太多，慢慢會習慣的」），態度真誠。
    2: 雖有口頭安慰但流於形式或過早給予虛假的保證，未能精準捕捉病人的脆弱感。
    1: 表現出不耐煩、否定病人情緒（如「這又沒什麼好怕的」）或無視病人之悲傷反應。
  關係締結與共同照護同盟:
    4: 邀請病人一同檢視造口底座修剪與黏貼，將衛教步驟化整為零，建立循序漸進的賦能計畫，並引介造口聯誼會與出院諮詢管道。
    3: 能指導造口護理步驟並回答居家疑慮，邀請病人參與練習，建立良好協作關係。
    2: 單向講解護理步驟，雖有示範但缺乏讓病人親自嘗試之引導，決策多為主觀安排。
    1: 態度權威或消極，未與病人建立協作照護關係，未提供居家支援資源。

examiner:
  setting: 一般病房（外科病房）
  sp_profile: 58歲女性，退休教師，直腸癌術後第5天，先生白天上班，自尊心強且害怕異味外漏
  start_position: 坐在病床旁椅子上，雙手緊抓衣角，眼神望向窗外
  summary: 直腸癌術後第5天即將出院，造口外觀良好，但病人對身體心象改變感到自卑與無助，抗拒親手接觸造口。
  differentials: [身體心象紊亂, 造口適應障礙, 焦慮與憂鬱反應, 居家自我照顧能力缺失]
  props: 病床、椅子、造口袋示範模型、造口底座與剪刀

sp:
  setting: 一般病房
  start_position: 坐在床旁椅子上，雙手緊抓衣角，眼神望向窗外
  emotion: 焦慮 7/10，自卑與恐懼
  manner: 眼神刻意迴避腹部，說話聲音微弱，談及造口時會嘆氣並低下頭
  voice: 語調壓抑，帶有隱忍的哭腔
  principles: 考生若未主動展現同理或詢問感受，維持防衛姿態只回答短句；若考生真誠同理並溫柔引導，逐步傾訴對出門社交與家人眼光的恐懼。
  summary: 最擔心出門散步或參加合唱團時便袋會發出聲音或臭味，害怕家人會嫌棄自己。
  dialogue:
    - frame: 開場
      candidate: 林老師您好，我是今天的照顧護理師，想跟您聊聊出院後造口照顧的事情。
      sp: （勉強點頭）護士小姐你好……
    - frame: 探索故事與情緒暗號
      candidate: 我注意到您看著窗外眉頭深鎖，是不是對於出院回家這件事有些擔心？
      sp: 我在想……肚子上掛著這個袋子，不知道以後還能不能像正常人一樣出門。
    - frame: 同理與情感共鳴
      candidate: 突然要在身體上多照顧一個造口，換作是任何人，心裡一定都會感到害怕和不知所措。
      sp: 真的很難接受……每次看到它我都覺得自己變得殘缺不全……
    - frame: 疑慮提問（SP 提問）
      candidate: 面對這麼大的改變需要時間調適，我們一步一步來。您目前最擔心的是哪個部分？
      sp: 如果出門在外面突然漏出來或是發出臭味，大家會怎麼看我？
      question: true
    - frame: 賦能與夥伴締結 (Teach-back)
      candidate: 現在的便袋都有活性碳除臭濾片和防漏設計。我們今天先從辨識底座黏貼密合度開始練習，您可以回述一下剛剛防漏膏塗抹的要點嗎？
      sp: （點頭確認）防漏膏要沿著造口周圍均勻填平，等兩分鐘微乾後再貼上底座。
  room_diagram: "【病房】病床靠窗，SP 坐在床旁椅上；考生坐在病患斜前方同高度椅子；考官坐在病床尾端桌旁觀察；桌上備有造口衛教模型與用品。"
